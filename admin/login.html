<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="../manifest.webmanifest"><title>Admin login</title><link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../assets/css/styles.css"><link rel="stylesheet" href="../assets/css/admin.css"><link rel="stylesheet" href="../assets/css/responsive.css"></head><body><main class="login"><h1>Shagar Medical Store Admin (demo)</h1><p id="lmsg" class="warn" role="status"></p><form id="f"><label>User<select id="r"></select></label><label>Demo code<input id="c" type="password" autocomplete="off" required></label><small>Demo code: <b>demo</b>. This is not real security.</small><button class="btn">Log in</button></form><p><a href="../index.html">Back to store</a></p></main><script src="../assets/js/utils.js"></script><script src="../assets/js/i18n.js"></script><script src="../assets/js/storage.js"></script><script>{const m=sessionStorage.getItem('mc_msg');if(m){lmsg.textContent=m;sessionStorage.removeItem('mc_msg')}}for(const u of db().users.filter(u=>u.active))r.append(h('option',{value:u.id},u.name+' ('+u.role+')'));f.onsubmit=e=>{e.preventDefault();if(c.value!=='demo')return toast('Wrong demo code',1);const u=db().users.find(x=>x.id===r.value);if(!u||!u.active)return toast('User is inactive',1);sessionStorage.setItem('mc_role',u.role);location.href='index.html'}</script></body></html>
